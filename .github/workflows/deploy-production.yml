# Production deploy of the Egypt Roamer theme and Core plugin to GoDaddy Managed WordPress.
#
# Deploys ONLY:
#   wordpress/wp-content/themes/egypt-roamer          -> html/wp-content/themes/egypt-roamer        (without src/)
#   wordpress/wp-content/plugins/egypt-roamer-core    -> html/wp-content/plugins/egypt-roamer-core
# Nothing else is uploaded, and cleanup (removing files deleted from git) is limited to those two
# folders. No database work runs here: no seed, migrations, imports, translations or images.
# Runbook: docs/DEPLOY.md
name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - "wordpress/wp-content/themes/egypt-roamer/**"
      - "wordpress/wp-content/plugins/egypt-roamer-core/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

# One production deploy at a time; a new one waits for the running one instead of cancelling it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  THEME_SRC: wordpress/wp-content/themes/egypt-roamer
  CORE_SRC: wordpress/wp-content/plugins/egypt-roamer-core
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        php: ["8.1", "8.3"] # 8.1 = "Requires PHP" of the theme and Core
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: PHP syntax (theme + Core)
        run: |
          find "$THEME_SRC" "$CORE_SRC" -name '*.php' -print0 | xargs -0 -n1 php -l > lint.txt 2>&1 \
            || { grep -v '^No syntax errors' lint.txt; exit 1; }
          echo "$(grep -c '^No syntax errors' lint.txt) PHP files OK"

      - name: Versions agree
        run: |
          core_header=$(sed -n 's/^ \* Version: *//p' "$CORE_SRC/egypt-roamer-core.php")
          core_const=$(sed -n "s/.*define( 'ER_CORE_VERSION', '\([^']*\)'.*/\1/p" "$CORE_SRC/egypt-roamer-core.php")
          theme_header=$(sed -n 's/^Version: *//p' "$THEME_SRC/style.css")
          theme_const=$(sed -n "s/.*define( 'ER_THEME_VERSION', '\([^']*\)'.*/\1/p" "$THEME_SRC/functions.php")
          echo "Core $core_header/$core_const · theme $theme_header/$theme_const"
          [ -n "$core_header" ] && [ "$core_header" = "$core_const" ] || { echo "::error::Core header and ER_CORE_VERSION differ"; exit 1; }
          [ -n "$theme_header" ] && [ "$theme_header" = "$theme_const" ] || { echo "::error::Theme header and ER_THEME_VERSION differ"; exit 1; }

      - name: Seed data is valid JSON
        run: python3 -m json.tool "$CORE_SRC/data/seed.json" > /dev/null

      - name: Theme JS bundles match src/js
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import build as b
          stubs = {f"locales/{c}.js" for c in b.LOCALES}
          banner = "/* GENERATED by tools/build.py from src/js — do not edit. */\n"
          stale = [out for entry, out in (("main.js", "home.js"), ("site-main.js", "site.js"))
                   if b.bundle(b.THEME_SRC, entry, stubs=stubs, banner=banner) != (b.THEME_OUT / out).read_text(encoding="utf-8")]
          if stale:
              print("::error::Rebuild with `python3 tools/build.py theme`; stale:", ", ".join(stale))
              sys.exit(1)
          print("home.js and site.js match src/js")
          PY

  deploy:
    name: Deploy to production
    needs: test # runs only when every test job passed
    if: github.ref == 'refs/heads/main' # a manual run from any other branch never deploys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      # The deployer uploads everything under source_path, so stage exactly what may go live.
      - name: Stage theme and Core
        run: |
          mkdir -p _deploy
          rsync -a --exclude 'src/' "$THEME_SRC/" _deploy/egypt-roamer/
          rsync -a "$CORE_SRC/" _deploy/egypt-roamer-core/
          test -f _deploy/egypt-roamer/style.css
          test -f _deploy/egypt-roamer-core/egypt-roamer-core.php
          test ! -e _deploy/egypt-roamer/src
          if find _deploy \( -name wp-config.php -o -name '.htaccess' -o -path '*/wp-admin/*' -o -path '*/wp-includes/*' -o -path '*/uploads/*' \) | grep -q .; then
            echo "::error::Staged files include WordPress core, config or uploads"; exit 1
          fi
          echo "Theme: $(find _deploy/egypt-roamer -type f | wc -l) files · Core: $(find _deploy/egypt-roamer-core -type f | wc -l) files"

      - name: Deploy Core
        uses: godaddy-wordpress/gd-wordpress-deployer@v1
        with:
          remote_host: 1284039.eu11.myftpupload.com
          ssh_user: git_deployer_71e07e2d98_1284039
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          source_path: _deploy/egypt-roamer-core
          deployment_dest: wp-content/plugins/egypt-roamer-core # relative to html/
          cleanup_deleted_files: "yes" # only inside this folder
          enable_health_check: "yes" # rolls back if WordPress is unhealthy afterwards

      - name: Deploy theme
        uses: godaddy-wordpress/gd-wordpress-deployer@v1
        with:
          remote_host: 1284039.eu11.myftpupload.com
          ssh_user: git_deployer_71e07e2d98_1284039
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          source_path: _deploy/egypt-roamer
          deployment_dest: wp-content/themes/egypt-roamer # relative to html/
          cleanup_deleted_files: "yes" # only inside this folder
          enable_health_check: "yes"

      - name: Live version check
        run: |
          want=$(sed -n "s/.*define( 'ER_CORE_VERSION', '\([^']*\)'.*/\1/p" "$CORE_SRC/egypt-roamer-core.php")
          got=$(curl -fsS -A "Mozilla/5.0 deploy-check" "https://egyptroamer.com/?deploy=$GITHUB_RUN_ID" | grep -o 'track\.js?ver=[^"&'"'"']*' | head -1 | cut -d= -f2 || true)
          echo "Core in git: $want · live page: ${got:-not found}"
          [ "$want" = "$got" ] || echo "::warning::The live page still shows Core ${got:-?}. GoDaddy's page cache may need a flush (WP admin bar → Flush cache)."
